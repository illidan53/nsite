name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每周一重新拉取海缆、云区域和 RIPE Atlas 锚点数据并发布
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  id-token: write

concurrency:
  group: nsite-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::612153676415:role/nsite-github-deploy
  S3_BUCKET: nsite-global-network
  CLOUDFRONT_DISTRIBUTION_ID: EPWME9SQHEM2B
  PUBLIC_URL: https://global-network.nphunter.gg

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # 原始下载按 ISO 周缓存：同一周内的重复部署不再逐条请求 TeleGeography / RIPE Atlas
      - name: Data cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .data-cache
          key: data-cache-${{ steps.week.outputs.week }}

      - name: Build data
        run: npm run data

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 先传带哈希的资源和数据，最后传 index.html，避免访问者拿到指向尚未上传资源的新页面
      - name: Upload to S3
        run: |
          aws s3 sync dist/assets "s3://${S3_BUCKET}/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist/data "s3://${S3_BUCKET}/data" --delete --exclude landmask.bin \
            --cache-control "public, max-age=3600"
          # CloudFront 不压缩 application/octet-stream；陆地位图预先 gzip（810 KB → 约 40 KB）
          gzip -9 -c dist/data/landmask.bin > "$RUNNER_TEMP/landmask.bin.gz"
          aws s3 cp "$RUNNER_TEMP/landmask.bin.gz" "s3://${S3_BUCKET}/data/landmask.bin" \
            --content-type application/octet-stream --content-encoding gzip \
            --cache-control "public, max-age=3600"
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, max-age=0, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/" "/data/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$INVALIDATION_ID"

      - name: Smoke test
        run: |
          curl -fsS "$PUBLIC_URL/" | grep -q "Net Globe"
          for f in network.json countries.topo.json admin1.topo.json landmask.bin; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/data/$f")
            echo "$f: $code"
            [ "$code" = "200" ]
          done
